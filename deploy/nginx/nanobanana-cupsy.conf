# Public HTTPS source endpoint used by Cupsy Assets. Keep the application UI
# and authenticated API on their existing ports.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 154.36.185.182;

    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 154.36.185.182;

    ssl_certificate /etc/letsencrypt/live/154.36.185.182/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/154.36.185.182/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CupsyTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Signed source URLs contain bearer-like tokens and must not enter logs.
    access_log off;

    location ^~ /api/cupsy/source/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        return 404;
    }
}
